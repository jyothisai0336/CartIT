name: CartIt CI/CD
on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging]

env:
  AWS_REGION: ap-south-1
  ECR_REPO:   cartit-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --coverage --watchAll=false
      - uses: SonarSource/sonarcloud-github-action@master
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}" }

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { aws-access-key-id: "${{ secrets.AWS_ACCESS_KEY_ID }}", aws-secret-access-key: "${{ secrets.AWS_SECRET_ACCESS_KEY }}", aws-region: "${{ env.AWS_REGION }}" }
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        uses: docker/metadata-action@v5
        with: { images: "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}", tags: "type=sha,prefix=,format=short" }
      - uses: docker/build-push-action@v5
        with: { context: ., file: devops/docker/Dockerfile, push: true, tags: "${{ steps.meta.outputs.tags }}", cache-from: "type=gha", cache-to: "type=gha,mode=max" }
      - uses: aquasecurity/trivy-action@master
        with: { image-ref: "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.meta.outputs.version }}", format: table, exit-code: "1", severity: "CRITICAL,HIGH", ignore-unfixed: "true" }

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: { name: production, url: "https://cartit.in" }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { aws-access-key-id: "${{ secrets.AWS_ACCESS_KEY_ID }}", aws-secret-access-key: "${{ secrets.AWS_SECRET_ACCESS_KEY }}", aws-region: "${{ env.AWS_REGION }}" }
      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name cartit-prod --region $AWS_REGION
          cd devops/kubernetes/overlays/prod
          kustomize edit set image ${{ secrets.ECR_REGISTRY }}/cartit-frontend:${{ needs.build.outputs.image-tag }}
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment/cartit-frontend -n cartit --timeout=10m
      - name: CloudFront Invalidation
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} --paths "/*"
