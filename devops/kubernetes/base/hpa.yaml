apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cartit-frontend-hpa
  namespace: cartit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cartit-frontend
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 5
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120
