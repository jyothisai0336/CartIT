worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 4096; multi_accept on; use epoll; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on; tcp_nopush on; keepalive_timeout 65;
  gzip on; gzip_vary on; gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://img.spoonacular.com https://placehold.co; connect-src 'self';" always;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /health { return 200 '{"status":"ok","app":"cartit"}'; add_header Content-Type application/json; }
    location ~* \.(php|asp|aspx|jsp)$ { return 404; }
    location ~ /\. { deny all; }
  }
}
