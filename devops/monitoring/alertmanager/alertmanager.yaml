global:
  resolve_timeout: 5m
  slack_api_url: 'YOUR_SLACK_WEBHOOK_URL'
route:
  group_by: [alertname, namespace]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: slack-cartit
  routes:
    - match: { severity: critical }
      receiver: pagerduty-cartit
receivers:
  - name: slack-cartit
    slack_configs:
      - channel: '#cartit-alerts'
        title: '[{{ .Status | toUpper }}] CartIt Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
  - name: pagerduty-cartit
    pagerduty_configs:
      - service_key: 'YOUR_PAGERDUTY_KEY'
