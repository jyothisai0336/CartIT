apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cartit-alerts
  namespace: cartit
spec:
  groups:
    - name: cartit.frontend
      interval: 30s
      rules:
        - alert: CartItHighErrorRate
          expr: sum(rate(nginx_http_requests_total{status=~"5.."}[5m])) / sum(rate(nginx_http_requests_total[5m])) > 0.05
          for: 2m
          labels: { severity: critical, team: cartit-devops }
          annotations: { summary: "CartIt error rate > 5%", description: "Error rate is {{ $value | humanizePercentage }}" }
        - alert: CartItHighLatency
          expr: histogram_quantile(0.99, rate(nginx_http_request_duration_seconds_bucket[5m])) > 2
          for: 3m
          labels: { severity: warning }
          annotations: { summary: "CartIt p99 latency > 2s" }
        - alert: CartItPodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="cartit"}[15m]) > 0
          for: 5m
          labels: { severity: critical }
          annotations: { summary: "Pod {{ $labels.pod }} is crash looping" }
        - alert: CartItHPAMaxedOut
          expr: kube_horizontalpodautoscaler_status_current_replicas{namespace="cartit"} >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="cartit"}
          for: 5m
          labels: { severity: warning }
          annotations: { summary: "CartIt HPA at max replicas — needs scaling" }
